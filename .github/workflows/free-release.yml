name: Free Release (Windows)

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/free-release.yml'
  workflow_dispatch:

concurrency:
  group: free-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TARGET_DIR: D:\cargo-target-free

jobs:
  build-free:
    name: Build Free x64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # pnpm must be on PATH BEFORE setup-node: its `cache: pnpm` resolves
      # the store through the pnpm executable and fails with
      # "Unable to locate executable file: pnpm" otherwise.
      - run: npm install -g pnpm@12.8.1

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm copy-proxy-binary:release

      - run: pnpm tauri build --features free
        env:
          PROFILE: release

      - name: Create portable bundle
        shell: pwsh
        run: |
          # CARGO_TARGET_DIR redirects cargo output away from src-tauri\target,
          # and the exact triple subdir depends on whether --target was passed;
          # pick whichever candidate actually holds the binary.
          $cands = @(
            "src-tauri\target\x86_64-pc-windows-msvc\release",
            "src-tauri\target\release",
            "$env:CARGO_TARGET_DIR\x86_64-pc-windows-msvc\release",
            "$env:CARGO_TARGET_DIR\release"
          )
          $src = $cands | Where-Object { Test-Path "$_\donutbrowser.exe" } | Select-Object -First 1
          if (-not $src) { throw "donutbrowser.exe not found in: $($cands -join ', ')" }
          "bundle source: $src"
          $dst = "DonutOS-portable"
          mkdir $dst -Force | Out-Null

          Copy-Item "$src\donutbrowser.exe" "$dst\DonutOS.exe" -Force
          Copy-Item "$src\donut-proxy.exe" "$dst\" -ErrorAction SilentlyContinue
          Copy-Item "$src\xray.exe" "$dst\" -ErrorAction SilentlyContinue

          if (Test-Path "$src\resources") {
            Copy-Item "$src\resources" "$dst\" -Recurse -Force
          }

          New-Item "$dst\.portable" -Force | Out-Null
          mkdir "$dst\config" -Force | Out-Null
          ([guid]::NewGuid().ToString('N') + [guid]::NewGuid().ToString('N')) | Set-Content "$dst\config\automation-token.txt"

          Compress-Archive -Path $dst -DestinationPath "DonutOS-portable-x64.zip" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: donutos-portable
          path: DonutOS-portable-x64.zip
          retention-days: 7

      - uses: softprops/action-gh-release@v3
        with:
          files: DonutOS-portable-x64.zip
          tag_name: "free-${{ github.run_number }}"
          name: "DonutOS Build ${{ github.run_number }}"
          body: |
            Automated free-build from main.
            
            **Includes:**
            - Portable Windows x64 executable
            - Proxy and xray binaries
            - No vendor cloud integration (local only)
            - Automation-ready config with bearer token
            
            **Quick start:**
            1. Extract zip
            2. Run `DonutOS.exe`
            3. MCP: `http://localhost:10109/v1/mcp`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
